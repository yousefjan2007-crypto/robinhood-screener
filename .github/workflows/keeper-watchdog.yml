# robinhood_screener — the keeper watchdog. GitHub's cron is the one clock that needs no Mac and
# no running job; it fires ~14×/day here against a nominal 288 (measured 2026-09-12), which is
# enough to restart a dead keeper within the hour and to say SCAN STALE. It never scans, never
# pushes, never sees the GMGN key: restart + alert only. Three failed keeper runs in two hours
# open the circuit (no restart; the alert says so) so a broken keeper cannot loop forever.
name: robinhood-keeper-watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write             # dispatch a keeper (keeper.sh --ensure-keeper)
  contents: read

concurrency:
  group: screener-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    # inert while the repo is private (minutes) — the same guard screener.yml carries
    if: ${{ github.event_name != 'schedule' || github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Restart a dead keeper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # keeper.sh is the ONE definition of "alive" and of the breaker (KEEPER_CIRCUIT_FAILURES
          # keeper failures inside KEEPER_CIRCUIT_WINDOW_S): each answers 0 yes | 1 no | 2 unknown
          # (gh failed). Unknown never dispatches — an API blip must not queue a keeper beside a
          # live one; the next cron fire retries.
          set +e
          bash .github/keeper.sh --keeper-alive; alive=$?
          bash .github/keeper.sh --circuit-open; circuit=$?
          set -e
          if   [ "$alive" = 0 ];   then action=none
          elif [ "$alive" = 2 ];   then action=unknown
          elif [ "$circuit" = 0 ]; then action=circuit-open
          elif [ "$circuit" = 2 ]; then action=circuit-unknown
          else
            set +e; bash .github/keeper.sh --ensure-keeper watchdog; rc=$?; set -e
            case "$rc" in 0) action=restarted ;; 2) action=unknown ;; *) action=dispatch-failed ;; esac
          fi
          echo "keeper alive: $alive (0 yes, 1 no, 2 unknown); circuit: $circuit (0 open, 1 closed, 2 unknown); action: $action"
          echo "WATCHDOG_ACTION=$action" >> "$GITHUB_ENV"
      - name: Alert when stale
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watchdog.py --send
