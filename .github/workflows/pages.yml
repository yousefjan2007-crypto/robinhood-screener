# robinhood_screener — publish docs/ to GitHub Pages. Its own workflow and its own concurrency
# group: a deploy in flight must never delay the NEXT scan (measured 2026-09-12: the combined
# scan+deploy run took 400-610 s against a 300 s cadence, so alerts queued behind deploys).
# Dispatched by the keeper on every PAGES_EVERY_N_ITERATIONS-th push and by a one-shot's Persist
# step, always with `--ref main`: the github-pages environment allows only main. The deploy action
# is exempt from the 10-builds/hour limit of branch-based Pages.
name: robinhood-pages

on:
  workflow_dispatch: {}

concurrency:
  group: screener-pages
  cancel-in-progress: true   # a newer deploy supersedes an older one; nothing is lost

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
